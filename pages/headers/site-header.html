<!-- Measurement (CANON MEASUREMENT; DEPLOY.md "Measurement"). The ONE source
     of tracking for every page: Google Analytics 4 (gtag.js) and Microsoft
     Clarity load only when the hostname is www.omnifittraining.com or
     omnifittraining.com. On any other host (*.pages.dev previews, localhost)
     neither loads and site/site.js logs each event to the console instead.
     Clarity never loads on /fit-check. Test-only override, honoured on
     localhost / 127.0.0.1 only: ?omnifit-track=prod forces the production
     branch (tools/tracktest.js). No Google Tag Manager. HubSpot is deferred
     exactly as before. Each ID appears once on the page by design
     (build.py --check counts them). Load timing: see the note above afterLoad()
     below (Oct 25 2026 mobile speed pass). -->
<script>
(function () {
  var GA4 = 'G-0K6VLEC2VJ';
  var CLARITY = 'yzawpvwvdf';
  var host = location.hostname;
  var prod = (host === 'www.omnifittraining.com' || host === 'omnifittraining.com');
  if (!prod && (host === 'localhost' || host === '127.0.0.1') &&
      /[?&]omnifit-track=prod(?:&|$)/.test(location.search)) prod = true;
  var path = location.pathname.replace(/\/+$/, '') || '/';
  var fitCheck = (path === '/fit-check');

  function loadScript(src, attrs){
    var s = document.createElement('script');
    s.src = src;
    s.async = true;
    if (attrs){
      for (var k in attrs) s.setAttribute(k, attrs[k]);
    }
    document.head.appendChild(s);
  }

  /* Load timing (Oct 25 2026, mobile PageSpeed): nothing from Google, Clarity or
     HubSpot downloads while the page is first drawing. On a phone those ~700 KB
     were competing with the hero photo and fonts and were charged to mobile LCP.
     - GA4: gtag() and the config are queued at once (so no event is lost), and
       gtag.js itself loads after the page's load event, when the browser is idle.
     - Clarity + HubSpot: load on the visitor's first scroll, tap, click or key,
       or 5 seconds after the load event, whichever comes first. */
  function afterLoad(fn){
    function idle(){
      if ('requestIdleCallback' in window) requestIdleCallback(fn, {timeout: 2000});
      else setTimeout(fn, 200);
    }
    if (document.readyState === 'complete') idle();
    else window.addEventListener('load', idle, {once: true});
  }

  function onEngage(fn){
    var done = false, evs = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
    function go(){
      if (done) return;
      done = true;
      evs.forEach(function (e) { window.removeEventListener(e, go, {passive: true}); });
      fn();
    }
    evs.forEach(function (e) { window.addEventListener(e, go, {passive: true}); });
    afterLoad(function () { setTimeout(go, 5000); });
  }

  if (prod) {
    /* Google Analytics 4 (gtag.js). Google's snippet, with the data layer
       held in a local and the ID in GA4 so each appears once. gtag() exists
       only here: site.js treats its absence as "log to the console". */
    var dl = window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dl.push(arguments); };
    window.gtag('js', new Date());
    window.gtag('config', GA4);
    afterLoad(function () { loadScript('https://www.googletagmanager.com/gtag/js?id=' + GA4); });
  }

  onEngage(function () {
    if (prod && !fitCheck) {
      /* Microsoft Clarity */
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", CLARITY);
    }

    /* HubSpot (heavy) */
    loadScript("https://js-na2.hs-scripts.com/244441037.js", {"id":"hs-script-loader"});
  });
})();
</script>
