<!-- FAQPage -->
<script type="application/ld+json">

    {
      "@type": "Question",
      "name": "What makes OmniFit's private training different from other personal trainers in San Diego?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "OmniFit Performance trains clients at the studio inside Teqneeq FHC — a members-only functional health and performance lab at 10772 Thornmint Rd in 4S Ranch — with dedicated 1:1 coaching, no group classes, and no commercial-gym distractions. Every program is individually designed by a NASM Elite Trainer with corrective exercise (CES) and ACE orthopedic exercise (OES) credentials. Training follows a structured Assess → Correct → Build → Sustain methodology rather than random workouts."
      }
    },
    {
      "@type": "Question",
      "name": "How much does private personal training cost at OmniFit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Every program begins with the $90 OmniFit Performance Assessment — a BodyStat body composition baseline plus movement screen, credited toward your package if you continue. In-studio private training is offered as four named monthly packages by frequency — Essential, Momentum, Performance, and Peak — starting at $225/month at Teqneeq FHC with a 3-month commitment. In-home training starts at $275/month. Executive Hybrid Coaching starts at $299/month. Month-to-month options are available, and there are no activation fees. Full details on the Training Rates page."
      }
    },
    {
      "@type": "Question",
      "name": "What is the BodyStat assessment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The OmniFit Performance Assessment ($90) uses the BodyStat 1500 MDD — a medical-grade bioimpedance device — to establish your body composition baseline: fat mass, lean mass, and hydration markers. Combined with a 9-point movement screen, it gives us objective data to build your program from and to measure real progress against at rescans. If you continue into a training package, the assessment fee is credited toward your program."
      }
    },
    {
      "@type": "Question",
      "name": "Do you offer in-home private training in San Diego?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. OmniFit Performance offers in-home personal training throughout North County and coastal San Diego — including 4S Ranch, Rancho Santa Fe, Carmel Valley, Del Mar, Encinitas, Carlsbad, and as far south as La Jolla. Equipment is provided when needed, or your program is built around your own home gym. A travel fee may apply depending on location."
      }
    },
    {
      "@type": "Question",
      "name": "Who is private personal training best for?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "OmniFit Performance's private training is designed for professionals and executives over 30 who want structured, evidence-based coaching in a private setting. It's especially effective for clients with desk posture issues, joint concerns, post-rehab needs, or sustainable fat loss goals of 20–30 pounds over 4–6 months."
      }
    },
    {
      "@type": "Question",
      "name": "What credentials does the trainer have?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nemezio Lopez Perez holds NASM Elite Trainer status with specializations in Corrective Exercise (CES), Performance Enhancement (PES), Behavior Change (BCS), and Nutrition Coaching (CNC), plus an ACE Orthopedic Exercise Specialist (OES) certification and Precision Nutrition credentials. He has 190+ verified five-star reviews across Google, Yelp, Thumbtack, and Bark, and works exclusively with professionals over 30."
      }
    },
    {
      "@type": "Question",
      "name": "How do I get started with private personal training?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Book a free 45-minute consultation — a refundable $30 deposit reserves your time. We assess your goals, movement history, schedule, and any injuries or limitations. If it's a mutual fit, you receive a custom program recommendation and can start training within the week."
      }
    }
  ]
