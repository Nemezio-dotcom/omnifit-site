        "@type": "Answer",
        "text": "Prolonged desk sitting typically causes upper crossed syndrome (forward head, rounded shoulders, tight chest, weak upper back) and lower crossed syndrome (tight hip flexors, weak glutes, anterior pelvic tilt, lower back compression). These patterns lead to chronic neck tension, shoulder impingement, lower back pain, and reduced mobility — problems that worsen progressively without corrective intervention."
